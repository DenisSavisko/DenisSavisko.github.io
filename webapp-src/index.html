<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMainGoals</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 80px auto;
    padding: 0 20px;
    color: #1a1a1a;
    line-height: 1.6;
    text-align: center;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.muted { color: #666; font-size: 14px; }
  p.stake { font-size: 15px; margin: 4px 0; }
  p.deadline { font-size: 13px; color: #666; }
  button {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 28px;
    border-radius: 12px;
    background: #d64545;
    color: white;
    font-weight: 600;
    font-size: 16px;
    border: none;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  p.error { color: #d64545; font-size: 14px; }

  /* Goals tab — wider, left-aligned list, unlike the centered verify-flow layout above. */
  body.goals { max-width: 600px; text-align: left; }
  body.goals h1 { text-align: center; }
  #apple-sign-in-button { display: flex; justify-content: center; margin-top: 32px; }
  ul.goal-list { list-style: none; padding: 0; margin: 24px 0 0; }
  li.goal-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
  li.goal-row .title { flex: 1; font-weight: 500; }
  li.goal-row .deadline { font-size: 12px; color: #888; }
  span.status-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  span.status-active { background: #e6f0ff; color: #2a5ad1; }
  span.status-done { background: #e3f8e9; color: #1f9d55; }
  span.status-failed { background: #fdeaea; color: #d64545; }
</style>
</head>
<body>
  <div id="app">Loading…</div>
  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
