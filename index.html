<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMainGoals</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; }
  h1 { margin-bottom: 4px; }
  p.tagline { color: #666; margin-top: 0; }
  a { color: #d64545; }
  ul { padding-left: 20px; }
  /* Same pill treatment as 404.html's two buttons, so the pair reads identically wherever
     it appears. Wraps to stacked on a narrow phone instead of overflowing. */
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0 24px; }
  .cta a, .cta span { padding: 14px 28px; border-radius: 12px; font-weight: 600; text-decoration: none; }
  .cta a { background: #d64545; color: #fff; }
  .cta span { background: #e5e5ea; color: #999; }
  p.cta-note { color: #666; font-size: 14px; margin-top: -12px; }
</style>
</head>
<body>
  <h1>MyMainGoals</h1>
  <p class="tagline">Focus on up to three goals at a time — stake real money on the ones that matter.</p>

  <div class="cta">
    <!-- Not approved by Apple yet, so apps.apple.com/app/id0000000000 is a dead link. A plain
         span, not an <a> with hidden/disabled — no href at all means no click can ever go
         anywhere, rather than relying on a disabled treatment that's one CSS rule away from
         silently becoming clickable again (404.html hit exactly that bug). Swap to a real
         link once there's an App Store id. -->
    <span>Get the app (soon)</span>
    <a href="/webapp/">Try the web version →</a>
  </div>
  <p class="cta-note">The web version is the full app — goals, staking, and confirmations.
  Requires signing in with your Apple ID.</p>

  <ul>
    <li><a href="privacy-policy.html">Privacy Policy</a></li>
    <li><a href="support.html">Support</a></li>
  </ul>
</body>
</html>
