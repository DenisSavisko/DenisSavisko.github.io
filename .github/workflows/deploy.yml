name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp-src/package-lock.json

      - name: Build webapp
        working-directory: webapp-src
        run: |
          npm ci
          npm run build

      # Everything at repo root except webapp-src/ (its source, not part of the served site)
      # and .github/ is served as-is — same static files as today's legacy branch deploy.
      # `npm run build` above already wrote its output into webapp/ (see vite.config.ts).
      - name: Assemble site
        run: |
          mkdir _site
          shopt -s dotglob
          for item in *; do
            case "$item" in
              _site|webapp-src|.github|.git) continue ;;
            esac
            cp -R "$item" _site/
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
