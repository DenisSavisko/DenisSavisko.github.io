<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMainGoals</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  // Smart App Banner (Safari only) — disabled for now: not approved by Apple yet, so
  // app-id=0000000000 is a placeholder and the banner's own "View"/"GET" button would point
  // nowhere real. This is a *system* UI element Safari renders itself from the mere presence
  // of an apple-itunes-app meta tag — separate from, and not affected by, hiding the in-page
  // "Get the app" link below. Re-enable once there's a real numeric App Store id: restore the
  // meta.content line (app-argument carries this exact /verify/<token> URL through the App
  // Store install, so iOS redelivers it to .onOpenURL the first time the app opens).
  // var meta = document.createElement('meta');
  // meta.name = 'apple-itunes-app';
  // meta.content = 'app-id=0000000000, app-argument=' + window.location.href;
  // document.head.appendChild(meta);
</script>
<script>
  // /webapp is a separate, isolated static app (see webapp-src/) that can show the full
  // title/stake/deadline and confirm on the web — it establishes its own anonymous Supabase
  // session client-side rather than relying on one already existing here. Hash fragment, not
  // a path, so no server-side routing is needed for it.
  document.addEventListener('DOMContentLoaded', function () {
    var match = /^\/verify\/(.+)$/.exec(window.location.pathname);
    if (!match) return;
    var link = document.getElementById('web-link');
    link.href = '/webapp/#verify/' + match[1];
    link.hidden = false;
    document.getElementById('web-link-note').hidden = false;
  });
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; text-align: center; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p.muted { color: #666; font-size: 14px; }
  a.app-link { display: block; width: fit-content; margin: 12px auto 0; padding: 14px 28px; border-radius: 12px; background: #d64545; color: white; text-decoration: none; font-weight: 600; }
  .app-link-soon { display: block; width: fit-content; margin: 24px auto 0; padding: 14px 28px; border-radius: 12px; background: #e5e5ea; color: #999; font-weight: 600; }
  /* [hidden] is only display:none via the browser's default stylesheet — a same-specificity
     author rule that also sets `display` (a.app-link above, in this exact file) overrides it,
     so an element can carry the hidden attribute and still render. Confirmed the hard way: the
     "Get the app" link below rendered fully visible and clickable despite having `hidden` set,
     because a.app-link's `display: inline-block` won the cascade. !important here beats that
     unconditionally, for this and any future hidden+styled element in this file. */
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <!--
    This page loads for any unmatched path (GitHub Pages' 404.html catch-all trick, since
    static hosting can't route dynamic /verify/<token> paths natively). Reached only when
    the app isn't installed — with the app installed, the Universal Link opens
    VerifyGoalView directly and never reaches here.

    Deliberately shows nothing about the goal — no title, stake, or deadline. Reading that
    data now requires a signed-in app session (get_verification has no anon grant): the
    person who composed the share message controls who reads it there, but a bare link
    with no session attached shouldn't be able to pull anything from the database, even
    non-sensitive fields. The "try the web version" link below opts into that instead, on a
    separate page that establishes its own session before reading anything.
  -->
  <h1>Get MyMainGoals</h1>
  <p class="muted">See what you were asked to confirm.</p>
  <!-- Not approved by Apple yet, so apps.apple.com/app/id0000000000 is a dead link. A plain
       span, not an <a> with hidden/disabled — no href at all means no click can ever go
       anywhere, rather than relying on a hidden/disabled treatment that's one CSS rule away
       from silently becoming clickable again (see the [hidden] comment above). Swap back to
       a real link once there's an App Store id. -->
  <span class="app-link-soon">Get the app (soon)</span>
  <a class="app-link" id="web-link" href="#" hidden>Try the web version →</a>
  <p class="muted" id="web-link-note" hidden style="margin-top: 8px;">Requires signing in with your Apple ID.</p>
</body>
</html>
