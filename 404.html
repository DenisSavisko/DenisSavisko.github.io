<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMainGoals</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  // Smart App Banner (Safari only) — a system UI element Safari renders from the presence of
  // an apple-itunes-app meta tag. Built in script rather than static markup so app-argument
  // can carry this exact /verify/<token> URL through the App Store install; iOS redelivers it
  // to .onOpenURL the first time the app opens.
  var meta = document.createElement('meta');
  meta.name = 'apple-itunes-app';
  meta.content = 'app-id=6806742917, app-argument=' + window.location.href;
  document.head.appendChild(meta);
</script>
<script>
  // /webapp is a separate, isolated static app (see webapp-src/) that can show the full
  // title/deadline and confirm on the web — it establishes its own anonymous Supabase
  // session client-side rather than relying on one already existing here. Hash fragment, not
  // a path, so no server-side routing is needed for it.
  //
  // The confirm-in-browser link is shown only on /verify/<token> paths, so a friend without
  // the app can still confirm. It's deliberately not a general "web version" link — the App
  // Store app doesn't point people at the web version.
  document.addEventListener('DOMContentLoaded', function () {
    var match = /^\/verify\/(.+)$/.exec(window.location.pathname);
    if (!match) return;
    var link = document.getElementById('web-link');
    link.href = '/webapp/#verify/' + match[1];
    link.hidden = false;
    document.getElementById('subtitle').textContent = 'See what you were asked to confirm.';
  });
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; text-align: center; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p.muted { color: #666; font-size: 14px; }
  a.app-link { display: block; width: fit-content; margin: 12px auto 0; padding: 14px 28px; border-radius: 12px; background: #d64545; color: white; text-decoration: none; font-weight: 600; }
  a.app-link.first { margin-top: 24px; }
  a.app-link.secondary { background: #e5e5ea; color: #1a1a1a; }
  /* [hidden] is only display:none via the browser's default stylesheet — a same-specificity
     author rule that also sets `display` (a.app-link above, in this exact file) overrides it,
     so an element can carry the hidden attribute and still render. Confirmed the hard way: the
     web link below rendered fully visible and clickable despite having `hidden` set,
     because a.app-link's `display: inline-block` won the cascade. !important here beats that
     unconditionally, for this and any future hidden+styled element in this file. */
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <!--
    This page loads for any unmatched path (GitHub Pages' 404.html catch-all trick, since
    static hosting can't route dynamic /verify/<token> paths natively). Reached only when
    the app isn't installed — with the app installed, the Universal Link opens
    VerifyGoalView directly and never reaches here.

    Deliberately shows nothing about the goal — no title or deadline. Reading that
    data now requires a signed-in app session (get_verification has no anon grant): the
    person who composed the share message controls who reads it there, but a bare link
    with no session attached shouldn't be able to pull anything from the database, even
    non-sensitive fields. The "confirm in your browser" link below opts into that instead, on a
    separate page that establishes its own session before reading anything.
  -->
  <h1>Get MyMainGoals</h1>
  <!-- Generic by default, since this page catches *every* unmatched path, not just
       /verify/<token> — the script above swaps in the confirm-specific line for those. -->
  <p class="muted" id="subtitle">Focus on up to three goals at a time, and ask a friend to confirm when you’re done.</p>
  <a class="app-link first" href="https://apps.apple.com/app/id6806742917">Download on the App Store</a>
  <a class="app-link secondary" id="web-link" href="/webapp/" hidden>Confirm in your browser →</a>
</body>
</html>
